apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-app
  namespace: test-app

spec:
  replicas: 2

  selector:
    matchLabels:
      app: nginx-app

  template:
    metadata:
      labels:
        app: nginx-app

    spec:
      containers:
      - name: nginx-app
        image: iksok/test-nginx-app:v1
        ports:
        - containerPort: 80