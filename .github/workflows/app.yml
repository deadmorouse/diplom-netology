name: Application CI/CD

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:

permissions:
  contents: read

env:
  IMAGE: iksok/test-nginx-app
  VERSION: ${{ github.ref_name }}

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - name: Get source code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check release version
        if: github.ref_type == 'tag'
        run: |
          [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          git merge-base --is-ancestor HEAD origin/main

      - name: Build image
        run: docker build --pull -t "$IMAGE:$GITHUB_SHA" testapp

      - name: Test Nginx and web page
        run: |
          docker run --rm "$IMAGE:$GITHUB_SHA" nginx -t
          docker run -d --name app-test -p 127.0.0.1:8080:80 "$IMAGE:$GITHUB_SHA"
          trap 'docker rm -f app-test' EXIT
          curl --fail --retry 10 --retry-connrefused --retry-delay 1 --max-time 10 \
            http://127.0.0.1:8080/ -o "$RUNNER_TEMP/response.html"
          cmp testapp/index.html "$RUNNER_TEMP/response.html"

      - name: Log in to Docker Hub
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push image
        id: push
        if: github.event_name == 'push'
        run: |
          docker push "$IMAGE:$GITHUB_SHA"
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            docker tag "$IMAGE:$GITHUB_SHA" "$IMAGE:$VERSION"
            docker push "$IMAGE:$VERSION"
          fi
          image_ref=$(docker image inspect "$IMAGE:$GITHUB_SHA" --format '{{index .RepoDigests 0}}')
          echo "digest=${image_ref#*@}" >> "$GITHUB_OUTPUT"

  deploy:
    needs: build
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 10
    concurrency:
      group: deploy-test-app
      cancel-in-progress: false
    env:
      DIGEST: ${{ needs.build.outputs.digest }}
    steps:
      - name: Get Kubernetes manifests
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Deploy application
        run: |
          [[ "$DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]
          kubectl apply -f k8s/namespace.yaml
          kubectl apply -f k8s/service.yaml -f k8s/ingress.yaml
          kubectl set image --local -f k8s/deployment.yaml \
            nginx-app="$IMAGE@$DIGEST" -o yaml | kubectl apply -f -
          kubectl -n test-app rollout status deployment/nginx-app --timeout=180s
          kubectl -n test-app get pods -o wide
