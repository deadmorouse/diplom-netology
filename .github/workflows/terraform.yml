name: Terraform

on:
  push:
    branches: [main]
  pull_request:
    paths: ['terraform/**', '.github/workflows/terraform.yml']
  workflow_dispatch:

permissions:
  contents: read

env:
  TF_IN_AUTOMATION: 'true'
  TF_INPUT: 'false'

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      matrix:
        module: [bootstrap, main]
    defaults:
      run:
        working-directory: terraform/${{ matrix.module }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with:
          terraform_version: 1.10.1
          terraform_wrapper: false
      - run: terraform fmt -check *.tf
      - run: terraform init -backend=false -lockfile=readonly
      - run: terraform validate -no-color

  infrastructure:
    needs: validate
    if: >-
      vars.TF_AUTOMATION_ENABLED == 'true' && github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    concurrency:
      group: terraform-main
      cancel-in-progress: false
    defaults:
      run:
        working-directory: terraform/main
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.TF_STATE_ACCESS_KEY }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.TF_STATE_SECRET_KEY }}
      TF_VAR_token: ${{ secrets.YC_TOKEN }}
      TF_VAR_cloud_id: ${{ secrets.YC_CLOUD_ID }}
      TF_VAR_folder_id: ${{ secrets.YC_FOLDER_ID }}
      TF_VAR_public_key: ${{ secrets.VM_SSH_PUBLIC_KEY }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with:
          terraform_version: 1.10.1
          terraform_wrapper: false
      - name: Check infrastructure secrets
        run: |
          for name in AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY TF_VAR_token TF_VAR_cloud_id TF_VAR_folder_id TF_VAR_public_key; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing infrastructure credential: $name"
              exit 1
            fi
          done
      - run: terraform init -lockfile=readonly
      - run: terraform plan -no-color -out=tfplan
      - name: Apply on main push
        if: github.event_name == 'push'
        run: terraform apply -no-color tfplan
      - name: Remove saved plan
        if: always()
        run: rm -f tfplan
