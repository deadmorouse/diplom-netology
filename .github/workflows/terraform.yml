name: Terraform

on:
  push:
    branches: [main]
  pull_request:
    paths: ['terraform/**', '.github/workflows/terraform.yml']
  workflow_dispatch:

permissions:
  contents: read

env:
  TF_IN_AUTOMATION: 'true'
  TF_INPUT: 'false'

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      matrix:
        module: [bootstrap, main]
    defaults:
      run:
        working-directory: terraform/${{ matrix.module }}
    steps:
      - uses: actions/checkout@v6
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.10.1
          terraform_wrapper: false
      - run: terraform fmt -check *.tf
      - run: terraform init -backend=false -lockfile=readonly
      - run: terraform validate -no-color

  infrastructure:
    needs: validate
    if: vars.TF_AUTOMATION_ENABLED == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    concurrency:
      group: terraform-main
      cancel-in-progress: false
    defaults:
      run:
        working-directory: terraform/main
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.TF_STATE_ACCESS_KEY }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.TF_STATE_SECRET_KEY }}
      TF_VAR_token: ''
      TF_VAR_cloud_id: ${{ secrets.YC_CLOUD_ID }}
      TF_VAR_folder_id: ${{ secrets.YC_FOLDER_ID }}
      TF_VAR_public_key: ${{ secrets.VM_SSH_PUBLIC_KEY }}
    steps:
      - uses: actions/checkout@v6
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.10.1
          terraform_wrapper: false
      - name: Configure Yandex Cloud authentication
        env:
          YC_SERVICE_ACCOUNT_KEY: ${{ secrets.YC_SERVICE_ACCOUNT_KEY }}
        run: |
          : "${YC_SERVICE_ACCOUNT_KEY:?Add the YC_SERVICE_ACCOUNT_KEY repository secret}"
          key_file="$RUNNER_TEMP/terraform-ci-key.json"
          umask 077
          printf '%s' "$YC_SERVICE_ACCOUNT_KEY" > "$key_file"
          python3 -m json.tool "$key_file" > /dev/null
          echo "YC_SERVICE_ACCOUNT_KEY_FILE=$key_file" >> "$GITHUB_ENV"
      - run: terraform init -lockfile=readonly
      - run: terraform plan -no-color -out=tfplan
      - name: Apply on main push
        if: github.event_name == 'push'
        run: terraform apply -no-color tfplan
      - name: Remove temporary credentials and plan
        if: always()
        run: rm -f "$RUNNER_TEMP/terraform-ci-key.json" tfplan
